<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Employee Information System</title>
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
	integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
	crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
  <!-- Brand -->
  <a class="navbar-brand" href="#">Employee Information System</a>

  <!-- Toggler/collapsibe Button -->
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Navbar links -->
  <div class="collapse navbar-collapse" id="collapsibleNavbar">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/employees}">Employee Information System</a>
      </li>
    </ul>
  </div>
</nav>
<br>
<br>
	<div class = "container">
		<div class = "row">
			<div class ="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
				<h1 class = "text-center"> Update Student </h1>
				<div class = "card-body">
					<form th:action="@{/employees/{id} (id=${employee.id})}" th:object = "${employee}" method="POST">
						<div class ="form-group">
							<label> Employee Id  </label>
							<input
							type = "number"
							name = "empid"
							th:field = "*{empid}"
							class = "form-control"
							placeholder=" Enter Employee number " 
							/>
						</div>
						
						<div class ="form-group">
							<label> Employee Name  </label>
							<input
							type = "text"
							name = "name"
							th:field = "*{name}"
							class = "form-control"
							placeholder="Enter Employee  Name" 
							/>
						</div>
						
						<div class ="form-group">
							<label> Job  </label>
							<input
							type = "text"
							name = "job"
							th:field = "*{job}"
							class = "form-control"
							placeholder="Enter Job " 
							/>
						</div>

						<div class ="form-group">
							<label> Salary  </label>
							<input
							type = "number"
							name = "sal"
							th:field = "*{sal}"
							class = "form-control"
							placeholder="Enter Salary " 
							/>
						</div>
						
						<div class ="form-group">
							<label> Deptno  </label>
							<input
							type = "number"
							name = "deptno"
							th:field = "*{deptno}"
							class = "form-control"
							placeholder="Enter deptno " 
							/>
						</div>
						
						<div class = "box-footer">
							<button type="submit" class = "btn btn-primary">
								Update Student
							</button>
						</div>
					</form>
				
				</div>
			</div>
		</div>
	</div>
	<hr color='red'>
	<center><h1>Developed By Manish kumar Roy </h1></center>
	<hr color='green'>
</body>
</html>
